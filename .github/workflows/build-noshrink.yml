name: 构建不混淆 APK

# 这个工作流专门用于产出“关闭 R8 混淆”的可反编译包：
#  - 不需要作者仓库的私有 secrets，缺签名证书时会自动生成本地证书；
#  - 产物通过 Actions artifact 下载，不发布 Release、不推送 Telegram。
on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 产物文件名
        required: false
        default: Hchat-noshrink-signed.apk
  push:
    branches: [alt-entry]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/build-noshrink.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HCAT_VERSION_NAME: "6.6.6.patch5-noshrink"
      HCAT_VERSION_CODE: "560"
      HCAT_APK_NAME: ${{ github.event.inputs.apk_name || 'Hchat-noshrink-signed.apk' }}
      HCAT_STORE_PASSWORD: ${{ secrets.HCAT_STORE_PASSWORD || 'hchat123456' }}
      HCAT_KEY_ALIAS: ${{ secrets.HCAT_KEY_ALIAS || 'hchat' }}
      HCAT_KEY_PASSWORD: ${{ secrets.HCAT_KEY_PASSWORD || 'hchat123456' }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37
            build-tools;37.0.0

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 准备签名证书
        env:
          HCAT_KEYSTORE_BASE64: ${{ secrets.HCAT_KEYSTORE_BASE64 }}
        run: |
          set -e
          chmod +x ./gradlew
          mkdir -p app/keystore
          if [ -n "$HCAT_KEYSTORE_BASE64" ]; then
            echo "使用仓库 secrets 中的证书"
            printf '%s' "$HCAT_KEYSTORE_BASE64" | base64 -d > "app/keystore/。。.jks"
          else
            echo "未配置 HCAT_KEYSTORE_BASE64，生成本地自签名证书（签名会与官方包不同，覆盖安装需要先卸载）"
            keytool -genkeypair -v \
              -keystore "app/keystore/。。.jks" \
              -storepass "$HCAT_STORE_PASSWORD" \
              -keypass "$HCAT_KEY_PASSWORD" \
              -alias "$HCAT_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Hchat Local, OU=Dev, O=Local, L=NA, ST=NA, C=CN"
          fi

      - name: 构建 release（已关闭 minify / shrinkResources）
        run: |
          set -e
          grep -n "isMinifyEnabled" app/build.gradle.kts || true
          sh ./gradlew :app:assembleRelease --no-daemon -x lintVitalAnalyzeRelease

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Hchat-noshrink-release
          path: dist/*.apk
          if-no-files-found: error